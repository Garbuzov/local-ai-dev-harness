
# ═════════════════════════════════════════════════════════════════════════════
# PRESET "frontend-full" — FULL: all four MCP servers enabled.
# The lines above (a copy of the shipped `standard` preset) are unchanged to the character.
#
# When to take it: the task is about a live interface — debugging in the browser, performance
# traces, network, console, e2e scenarios, working with accumulated memory.
#
# Price (measured on this machine, ~tokens in EVERY request):
#   chrome-devtools ~6 423 + playwright ~5 072 + memory ~2 766 + context7 ~1 307
#   total ~15 567 against ~1 307 for the light preset.
# Check: node ~/.dsh/tools/measure-mcp-tools.mjs
#
# For everyday code writing take the "Frontend — light" preset: the same
# editor capabilities, but without 14 thousand tokens of overhead.
# ═════════════════════════════════════════════════════════════════════════════

# ── 1. context7: up-to-date library documentation ────────────────────────────
- id: mcp-context7
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: context7
    transport: stdio
    command: npx
    args: ['-y', '@upstash/context7-mcp']

# ── 2. chrome-devtools: agent-controlled browser ─────────────────────────────
# Performance traces, network, console with source maps, screenshots, DOM.
# Requires Chrome installed. Flags: --headless, --isolated, --slim.
# Google collects usage statistics by default; the flag turns it off.
- id: mcp-chrome-devtools
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: chrome-devtools
    transport: stdio
    command: npx
    args: ['-y', 'chrome-devtools-mcp@latest', '--no-usage-statistics']
    # Recording a performance trace does not fit into the default 60 s.
    toolCallTimeoutMs: 120000

# ── 3. playwright: browser automation and e2e ────────────────────────────────
- id: mcp-playwright
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: playwright
    transport: stdio
    command: npx
    args: ['-y', '@playwright/mcp@latest']
    toolCallTimeoutMs: 120000

# ── 4. memory: knowledge graph across sessions ───────────────────────────────
# Writes to ~/.dsh so that the graph file does not appear in the root of a random project.
- id: mcp-memory
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: memory
    transport: stdio
    command: npx
    args: ['-y', '@modelcontextprotocol/server-memory']
    cwd: !!js process.getBuiltinModule('node:path').join(process.env.USERPROFILE, '.dsh')

# ── 5. github: DISABLED ──────────────────────────────────────────────────────
# Two things are needed at once: the GITHUB_MCP_TOKEN variable and a running Docker.
# Enabling procedure — in the README, the GitHub MCP section.
- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: true
  config:
    serverName: github
    transport: stdio
    command: docker
    args:
      - run
      - -i
      - --rm
      - -e
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - -e
      - GITHUB_TOOLSETS
      - ghcr.io/github/github-mcp-server
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: !!js process.env.GITHUB_MCP_TOKEN
      GITHUB_TOOLSETS: repos,issues,pull_requests

# ═════════════════════════════════════════════════════════════════════════════
# LOCAL SUBAGENT — free delegation to a model in Ollama.
# The `local` route is declared in ~/.dsh/cordis.patch.yml. Requires a running Ollama.
# Details — in the comment of the same block in the `frontend` preset.
- id: tool-subagent-local
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_local
    backgroundMode: continuable
    agentOptions:
      provider: local
      model: llama3.1:8b
      maxTokens: 4096
